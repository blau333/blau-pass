[package]
name = "rustvault"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rustvault"
path = "main.rs"

[dependencies]
anyhow = "1"
argon2 = "0.5"
base32 = "0.5"
base64 = "0.22"
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive"] }
hmac = "0.12"
rand = "0.8"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
zeroize = "1"

[profile.release]
opt-level = 3
lto = true
